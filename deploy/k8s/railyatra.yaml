# RailYatra on Kubernetes: stateless API pods (Node gateway + engine pool),
# autoscaled on CPU, spread across zones, protected by a PodDisruptionBudget.
# Put a CDN in front of the Ingress for edge caching (see docs/SCALING_ROADMAP.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: railyatra-api
  labels: { app: railyatra-api }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }
  selector:
    matchLabels: { app: railyatra-api }
  template:
    metadata:
      labels: { app: railyatra-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: railyatra-api }
      containers:
        - name: api
          image: ghcr.io/pratham-the-warrior/railyatra:latest
          ports: [{ containerPort: 3000 }]
          # Sized from measurements (docs/CAPACITY.md): the Node gateway saturates
          # one core at ~1.9k req/s, so 2-vCPU pods (gateway + 2 engines) use
          # their CPU fully; scale out with more pods, not bigger ones.
          # Memory: ~185 MB baseline + cache budgets (256 + 32 + 32 MB) < 768Mi.
          env:
            - { name: ENGINE_POOL_SIZE, value: "2" }
            - { name: ROUTE_CACHE_MAX_MB, value: "256" }
            - { name: SMALL_CACHE_MAX_MB, value: "32" }
            - { name: LOG_FORMAT, value: "json" }
            # Proxy hops in front of the pod: 1 = ingress only; 2 = CDN + ingress.
            - { name: TRUST_PROXY, value: "1" }
            # Pod name as the instance id in logs, /api/health and X-Instance-Id.
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: "2", memory: "512Mi" }
            limits:   { cpu: "2", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            # Let the load balancer deregister the pod before draining.
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: railyatra-api
spec:
  selector: { app: railyatra-api }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: railyatra-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: railyatra-api }
  minReplicas: 3      # high availability across zones
  maxReplicas: 100    # ~190k req/s at 100% (1.9k/pod); see docs/CAPACITY.md
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: railyatra-api
spec:
  minAvailable: 66%
  selector:
    matchLabels: { app: railyatra-api }
