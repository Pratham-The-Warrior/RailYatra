# Edge tier for RailYatra: load balancing, micro-caching, rate limiting.
# In production the same rules map onto a CDN (CloudFront / Cloudflare / Fastly)
# in front of a regional L7 load balancer.
worker_processes auto;
events { worker_connections 8192; }

http {
    # Docker's embedded DNS resolves "api" to every replica.
    resolver 127.0.0.11 valid=10s;

    upstream railyatra_api {
        least_conn;
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    # 10 r/s per client IP with bursts; generous enough for autocomplete typing.
    limit_req_zone $binary_remote_addr zone=per_ip:20m rate=10r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx keys_zone=api_cache:50m max_size=1g inactive=30m use_temp_path=off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    server {
        listen 80;

        location = /readyz { proxy_pass http://railyatra_api; }

        # Route search is a POST, but idempotent: cache it on the request body.
        location = /api/route {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_cache api_cache;
            proxy_cache_methods POST;
            proxy_cache_key "$request_uri|$request_body";
            proxy_cache_valid 200 5m;
            proxy_cache_lock on;              # collapse identical misses
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            client_body_buffer_size 16k;      # keeps $request_body in memory for the key
            add_header X-Cache $upstream_cache_status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://railyatra_api;
        }

        location /api/ {
            limit_req zone=per_ip burst=40 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache $upstream_cache_status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://railyatra_api;
        }

        location / {
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://railyatra_api;
        }
    }
}
