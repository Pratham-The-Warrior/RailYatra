# Local / single-host horizontal scaling:
#   docker compose -f deploy/docker-compose.yml up --build --scale api=3
# nginx load-balances across all api replicas, caches GET + route responses,
# and applies per-IP rate limiting.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ENGINE_POOL_SIZE: "2"
      ROUTE_CACHE_MAX_MB: "256"
      SMALL_CACHE_MAX_MB: "32"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 768M
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
